[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulk_note"
version = "0.1.0"
description = "send bulk messages via api"
requires-python = ">=3.12"
authors = [
    {name = "danny crasto", email = "danwald79@gmail.com"},
]
license = {text = "GNU General Public License v3"}
dependencies = [
    "click>=7.0",
    "requests>=2.26.0",
]

[project.scripts]
bulk_note = "bulk_note.cli:main"

[tool.pytest.ini_options]
collect_ignore = ["setup.py"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "coverage>=7.13.5",
    "flake8>=7.3.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]
