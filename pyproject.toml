[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulk_note"
version = "0.1.0"
description = "send bulk messages via api"
requires-python = ">=3.12"
authors = [
    {name = "danny crasto", email = "danwald79@gmail.com"},
]
license = {text = "GNU General Public License v3"}
dependencies = [
    "click",
    "requests",
]

[project.scripts]
bulk_note = "bulk_note.cli:main"

[tool.pytest.ini_options]
collect_ignore = ["setup.py"]

[dependency-groups]
dev = [
    "black",
    "coverage",
    "flake8",
    "pre-commit",
    "pytest",
]
